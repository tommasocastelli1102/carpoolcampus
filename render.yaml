# Render blueprint — deploys all three pieces (backend, Postgres, frontend)
# from one repo. In the Render dashboard: New -> Blueprint -> pick this repo
# -> Apply. See README.md "Deploying to Render" for the full walkthrough.
#
# Note: if "carpoolcampus-backend" / "carpoolcampus-frontend" are already
# taken by someone else on Render, it'll assign yours a suffixed name
# instead (e.g. carpoolcampus-backend-ab12) — if that happens, update the
# CORS_ORIGINS and VITE_API_BASE_URL values below (or edit them directly in
# the Render dashboard after the first deploy) to match your real URLs.

databases:
  - name: carpoolcampus-db
    databaseName: carpoolcampus
    user: carpoolcampus
    plan: free

services:
  - type: web
    name: carpoolcampus-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: DATABASE_URL
        fromDatabase:
          name: carpoolcampus-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: CORS_ORIGINS
        value: https://carpoolcampus-frontend.onrender.com,http://localhost:5173,http://127.0.0.1:5173

  - type: web
    name: carpoolcampus-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://carpoolcampus-backend.onrender.com
    routes:
      # Client-side routing (React Router) — every path serves index.html
      # and the app's own router takes it from there.
      - type: rewrite
        source: /*
        destination: /index.html
